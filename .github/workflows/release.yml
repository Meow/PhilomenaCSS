name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # npm provenance and trusted publishing
  id-token: write

jobs:
  commitlint:
    name: 'Lint commit messages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  release:
    name: 'Version, publish to npm and release'
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dry_run: compute the next version without creating/pushing the tag yet.
      # The tag and GitHub release are only created once the package has actually
      # been published, so a failed build never leaves a version tag with no
      # matching npm release behind it.
      - name: Compute next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

      # Before 1.0.0 a breaking change bumps the minor version, as semver allows for 0.x: the tag action would
      # jump to 1.0.0 on the first "BREAKING CHANGE". Everything after this step uses its outputs.
      - name: Keep breaking changes in 0.x
        id: version
        if: steps.tag.outputs.new_tag
        env:
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
          PREVIOUS_VERSION: ${{ steps.tag.outputs.previous_version }}
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
        run: |
          version="$NEW_VERSION"
          previous="${PREVIOUS_VERSION:-0.0.0}"
          if [ "${previous%%.*}" = "0" ] && [ "$RELEASE_TYPE" = "major" ]; then
            minor="${previous#*.}"
            minor="${minor%%.*}"
            version="0.$((minor + 1)).0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.tag.outputs.new_tag
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js v24
        if: steps.tag.outputs.new_tag
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm dependencies
        if: steps.tag.outputs.new_tag
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        if: steps.tag.outputs.new_tag
        run: pnpm run build

      # The git tag decides the version; the one in package.json is overwritten here
      - name: Set package version
        if: steps.tag.outputs.new_tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # Authenticates with the NPM_TOKEN secret when it is set, otherwise through
      # npm trusted publishing (OIDC) once the package has it configured on npmjs.com
      - name: Publish to npm
        if: steps.tag.outputs.new_tag
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.tag.outputs.new_tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag
        run: gh release create "$TAG" --title "$TAG" --verify-tag --notes "$CHANGELOG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
